name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-19
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-19 main"
          sudo apt-get update -y
          sudo apt-get install -y clang-format-19

      - name: Check C formatting
        run: |
          find runtime-library/src runtime-library/include \
            -name '*.c' -o -name '*.h' | \
            grep -v -e 'protobuf-c\.[ch]' -e 'onnx\.pb-c\.[ch]' | \
            xargs clang-format-19 --dry-run --Werror

  build-toolchain:
    name: Build conversion toolchain + error-handling tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest onnx Pillow

      - name: Build Docker image
        run: bash conversion-toolchain/build-toolchain.sh

      - name: Run error-handling integration tests (no hardware required)
        run: python -m pytest tests/test_docker.py::TestErrorHandling -v

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: oaax-hailo-toolchain
          path: conversion-toolchain/artifacts/oaax-hailo-toolchain.tar
          retention-days: 1

  build-and-test:
    name: Build runtime + tests (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        platform: [X86_64, AARCH64]
        hailort_version: ["4.17.0", "4.18.0", "4.19.0", "4.20.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchains
        run: sudo bash scripts/setup-env.sh

      - name: Build runtime (${{ matrix.platform }})
        run: bash runtime-library/build-runtime.sh ${{ matrix.platform }} ${{ matrix.hailort_version }}

      - name: Check exported symbols (no GNU_UNIQUE, OAAX API only)
        run: bash tests/check_exports.sh runtime-library/build/libRuntimeLibrary.so

      - name: Build C++ tests (X86_64 only)
        if: matrix.platform == 'X86_64'
        run: bash tests/runtime/build-tests.sh

      - name: Run API-only tests (no hardware required)
        if: matrix.platform == 'X86_64'
        working-directory: tests/runtime/build
        run: |
          ./simple_test
          ./lifecycle_test
          ./queue_test

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-library-${{ matrix.platform }}-${{ matrix.hailort_version }}
          path: runtime-library/artifacts/runtime-library-${{ matrix.platform }}-${{ matrix.hailort_version }}.tar.gz
          retention-days: 1

  # Uploads the tested bytes: only a v* tag publishes a release, `main` pushes upload nothing.
  publish:
    name: Publish to the OAAX bucket
    runs-on: ubuntu-22.04
    needs: [lint, build-toolchain, build-and-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tag check below needs main's history

      - name: Tag must match VERSION and be on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [ "${TAG#v}" = "$(cat VERSION)" ] || { echo "tag $TAG does not match VERSION $(cat VERSION)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main, tag a commit of main"; exit 1; }

      - name: Download the build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install s3cmd
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd

      - name: Upload to S3
        env:
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        # The branch name reaches the script only through the environment (GITHUB_HEAD_REF), never through ${{ }}.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            mode=release name=$(cat VERSION)
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$S3_ACCESS_KEY" ]; then
            mode=branch name=$GITHUB_HEAD_REF
          else
            mode=dry name=$(cat VERSION)
          fi
          bash scripts/publish-artifacts.sh "$mode" "$name" artifacts
